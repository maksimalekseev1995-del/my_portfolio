<style>
/* ---------- tokens ---------- */
:root{--e:cubic-bezier(.22,1,.36,1);--d1:.15s;--d2:.25s;--d3:.45s;--tb:44px;--sat:0px;--sab:0px;--pad:clamp(16px,3.4vw,56px);--fm:'JetBrains Mono',ui-monospace,monospace}
:root{--tb:0px}
html.dB{--bg:#ECEAE4;--bg2:#DEDAD1;--fg:#141414;--mut:rgba(20,20,20,.56);--line:rgba(20,20,20,.15);--acc:#FF4A1C;--accfg:#fff;--fd:'Inter Tight',system-ui,sans-serif;--fb:'Inter Tight',system-ui,sans-serif;--fs:'Instrument Serif','Cormorant Garamond',Georgia,serif}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html.dB{color-scheme:light}
@media (prefers-color-scheme:dark){html.dB:not([data-theme="light"]):not([data-mode="light"]){--bg:#121211;--bg2:#1F1E1B;--fg:#ECEAE4;--mut:rgba(236,234,228,.56);--line:rgba(236,234,228,.15);--acc:#FF5A2E;--accfg:#fff;color-scheme:dark}}
html.dB[data-theme="dark"]:not([data-mode="light"]),html.dB[data-mode="dark"]{--bg:#121211;--bg2:#1F1E1B;--fg:#ECEAE4;--mut:rgba(236,234,228,.56);--line:rgba(236,234,228,.15);--acc:#FF5A2E;--accfg:#fff;color-scheme:dark}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip;transition:background-color var(--d3) var(--e),color var(--d3) var(--e)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
img,video{display:block;max-width:100%}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.ic{width:1em;height:1em;flex:none}
.mono{font-family:var(--fm);font-size:12px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;line-height:1.3}
.mut{color:var(--mut)}
.acc{color:var(--acc)}
.ul{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size var(--d2) var(--e)}
@media (hover:hover){.ul:hover{background-size:100% 1px}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#35D07F;margin-right:8px;vertical-align:1px;animation:pulse 2s var(--e) infinite}
@keyframes pulse{50%{opacity:.35}}
#app{padding-top:var(--tb);min-height:100vh}

/* ---------- reveal ---------- */
.ln{display:block;overflow:hidden;padding-bottom:.04em;margin-bottom:-.04em}
.ln>span{display:block;transform:translate3d(0,108%,0);transition:transform 1s var(--e) calc(var(--i,0)*80ms + var(--dl,0ms))}
.rv.in .ln>span{transform:none}
.fu{opacity:0;transform:translate3d(0,24px,0);transition:opacity .6s var(--e) calc(var(--i,0)*45ms),transform .8s var(--e) calc(var(--i,0)*45ms)}
.fu.in{opacity:1;transform:none}

/* ---------- media ---------- */
.x-m{position:relative;overflow:hidden;background:var(--bg2);width:100%}
.x-mi{position:absolute;inset:0;will-change:transform}
.x-mi[data-par]{inset:-9% 0}
.x-m img,.x-m video,.x-amb img,.x-amb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--e),opacity var(--d3) var(--e)}
.x-m video,.x-amb video{opacity:0}
.x-m video.on,.x-amb video.on{opacity:1}
.x-amb{position:absolute;inset:0;overflow:hidden;background:var(--bg2)}
@media (hover:hover){.hov:hover .x-m img,.hov:hover .x-m video{transform:scale(1.045)}}
.x-pm{position:relative;width:20px;height:20px;flex:none}
.x-pm::before,.x-pm::after{content:'';position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:currentColor;transition:transform var(--d3) var(--e)}
.x-pm::after{transform:rotate(90deg)}
.open .x-pm::after{transform:rotate(0)}
.x-acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--e)}
.x-acc-b>div{overflow:hidden;min-height:0}
.open>.x-acc-b{grid-template-rows:1fr}
.x-acc-in{opacity:0;transform:translate3d(0,8px,0);transition:opacity .2s,transform .45s var(--e)}
.open .x-acc-in{opacity:1;transform:none;transition:opacity .35s .08s,transform .45s var(--e) .08s}
.x-mq{overflow:hidden;white-space:nowrap}
.x-mq-t{display:inline-flex;align-items:center;will-change:transform}

/* ---------- player ---------- */
.x-pl{position:relative;width:100%;aspect-ratio:var(--ar,16/9);background:#000;overflow:hidden;color:#fff}
.x-pl.vert{max-width:min(100%,calc(78vh * var(--ar)));margin:0 auto}
.x-pl-po,.x-pl-v{position:absolute;inset:0;width:100%;height:100%}
.x-pl-po{object-fit:cover;transition:opacity var(--d3) var(--e)}
.x-pl-v{object-fit:contain}
.x-pl.started .x-pl-po{opacity:0}
.x-pl-big{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;font-size:30px;transition:transform var(--d3) var(--e),opacity var(--d2)}
@media (hover:hover){.x-pl-big:hover{transform:scale(1.08)}}
.x-pl.playing .x-pl-big,.x-pl.loading .x-pl-big{opacity:0;transform:scale(.8);pointer-events:none}
.x-pl-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:12px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transform:translate3d(0,8px,0);transition:opacity var(--d2),transform var(--d3) var(--e);pointer-events:none}
.x-pl.started .x-pl-bar{opacity:1;transform:none;pointer-events:auto}
.x-pl.started.playing.idle .x-pl-bar{opacity:0;transform:translate3d(0,8px,0)}
.x-ib{width:44px;height:44px;display:grid;place-items:center;font-size:20px;border-radius:50%;flex:none}
.x-ib .ic{width:20px;height:20px}
.i-pa,.i-m{display:none}
.x-pl.playing .i-pl{display:none}.x-pl.playing .i-pa{display:block}
.x-pl.muted .i-v{display:none}.x-pl.muted .i-m{display:block}
.x-pl-tr{flex:1;height:44px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.x-pl-tr i{display:block;position:relative;height:3px;width:100%;background:rgba(255,255,255,.28);border-radius:2px;overflow:hidden}
.x-pl-tr b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
.x-pl-t{color:rgba(255,255,255,.85);white-space:nowrap;min-width:92px;text-align:right}
.x-pl-load{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;display:none}
.x-pl.loading .x-pl-load{display:block}
.x-pl-load i{display:block;width:100%;height:100%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.x-pl-err{position:absolute;inset:0;display:none;place-content:center;justify-items:center;gap:12px;background:rgba(0,0,0,.72);text-align:center;font-size:15px}
.x-pl.err .x-pl-err{display:grid}
.x-btn-s{height:40px;padding:0 18px;border-radius:99px;background:#fff;color:#000;font-weight:600;font-size:14px}
.x-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.x-tabs button{height:44px;padding:0 18px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;gap:10px;align-items:center;white-space:nowrap;font-weight:600;font-size:14px;transition:background var(--d1),color var(--d1)}
.x-tabs button.on{background:var(--fg);color:var(--bg)}
.x-tabs .mono{opacity:.6}

/* ---------- empty ---------- */
.x-empty{padding:clamp(80px,12vw,160px) var(--pad);display:grid;justify-items:center;text-align:center;gap:16px}
.x-empty-t{font:700 clamp(28px,4vw,48px)/1.05 var(--fd)}
.x-empty .mut{max-width:420px}
.x-empty-b{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.x-empty-b button{height:48px;padding:0 22px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.x-empty-b button:first-child{background:var(--acc);color:var(--accfg);box-shadow:none}

/* ---------- chrome: toolbar, stage, header, menu, overlays ---------- */
.hd{position:fixed;left:0;right:0;top:var(--tb);z-index:60;display:flex;align-items:center;gap:24px;padding:calc(var(--sat) + 18px) var(--pad) 18px;pointer-events:none;transition:background var(--d2),transform var(--d3) var(--e)}
.hd>*{pointer-events:auto}
.hd-nav{display:flex;gap:28px;margin-left:auto}
.hd-nav a{display:inline-flex;align-items:center;min-height:44px}
.hd-menu{display:none;margin-left:auto;min-height:44px;min-width:44px}
@media (max-width:759px){.hd-nav,.hd-x{display:none!important}.hd-menu{display:block}}
.mn{position:fixed;inset:0;z-index:55;background:var(--bg);padding:calc(var(--tb) + var(--sat) + 96px) var(--pad) calc(var(--sab) + 32px);display:flex;flex-direction:column;gap:4px;opacity:0;visibility:hidden;transition:opacity var(--d2) var(--e),visibility 0s var(--d2)}
.mn.open{opacity:1;visibility:visible;transition:opacity var(--d2) var(--e)}
.mn-l{display:block;overflow:hidden;font:800 clamp(44px,13vw,72px)/1.02 var(--fd);text-transform:uppercase}
.dB .mn-l{text-transform:none;font-weight:600;letter-spacing:-.04em}
.mn-l span{display:block;transform:translate3d(0,100%,0);transition:transform .6s var(--e)}
.mn.open .mn-l span{transform:none;transition-delay:calc(var(--i)*50ms + 80ms)}
.mn-c{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 20px}
.mn-c a{min-height:44px;display:inline-flex;align-items:center}
.cv{position:fixed;inset:var(--tb) 0 0;z-index:280;background:var(--acc);color:var(--accfg);transform:translateY(100%);display:grid;place-items:center;pointer-events:none;visibility:hidden;overflow:hidden}
.cv span{font:850 clamp(44px,10vw,170px)/.9 var(--fd);text-transform:uppercase;text-align:center;padding:0 var(--pad)}
.dB .cv{background:var(--fg);color:var(--bg)}
.dB .cv span{font:italic 400 clamp(56px,11vw,190px)/.9 var(--fs);text-transform:none}
.cur{position:fixed;left:0;top:0;z-index:400;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;mix-blend-mode:difference;display:none;place-items:center;transition:width var(--d3) var(--e),height var(--d3) var(--e),margin var(--d3) var(--e),background-color var(--d2),opacity var(--d2)}
@media (hover:hover) and (pointer:fine){.cur{display:grid}}
.frame .cur,.cur.hide{opacity:0}
.cur span{font:600 11px/1 var(--fm);text-transform:uppercase;letter-spacing:.04em;color:var(--accfg);opacity:0;white-space:nowrap;transition:opacity var(--d1)}
.cur.big{width:92px;height:92px;margin:-46px 0 0 -46px;background:var(--acc);mix-blend-mode:normal}
.cur.big span{opacity:1}
.fp{position:fixed;left:0;top:0;z-index:58;width:min(28vw,400px);aspect-ratio:16/9;pointer-events:none;opacity:0;overflow:hidden;border-radius:6px;background:var(--bg2);transition:opacity var(--d2) var(--e)}
.fp.on{opacity:1}
.fp video,.fp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lb{position:fixed;inset:0;z-index:320;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:64px var(--pad);opacity:0;transition:opacity var(--d2) var(--e)}
.lb[hidden]{display:none}
.lb.open{opacity:1}
.lb-in{width:min(100%,1280px);transform:translate3d(0,6px,0) scale(.97);transition:transform var(--d3) var(--e);color:#fff}
.lb.open .lb-in{transform:none}
.lb-in img{width:100%;max-height:78vh;object-fit:contain}
.lb-in .x-pl{max-height:80vh}
.lb-x{position:absolute;top:calc(12px + var(--sat));right:12px;color:#fff}
.lb-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#fff}
.toasts{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);z-index:350;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1f1f1f;color:#f2f2f2;font:500 14px/1.35 'Inter Tight',sans-serif;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:tin .45s var(--e);transition:opacity .26s;max-width:min(90vw,420px)}
.toast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(24px)}}
.grain{position:fixed;inset:-10%;z-index:240;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .9s steps(3) infinite}
.dB .grain{opacity:.06;mix-blend-mode:multiply}
.dark .grain{opacity:.07;mix-blend-mode:screen}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}}

/* ================= B · INDEX ================= */
.b-btn:active,.x-tabs button:active,.b-chip:active{transform:scale(.96)}
.b-frames button{position:relative;overflow:hidden;aspect-ratio:var(--ar,16/9);background:var(--bg2);cursor:zoom-in}
.b-frames img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--e)}
@media (hover:hover){.b-frames button:hover img{transform:scale(1.06)}}
.dB .hd{color:var(--fg);font:500 14px/1.2 var(--fb)}
.dB .hd.solid{background:color-mix(in srgb,var(--bg) 94%,transparent)}
.b-tg{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;margin-left:4px;transition:background var(--d2)}
.b-tg .ic{width:20px;height:20px;transition:transform .6s var(--e)}
@media (hover:hover){.b-tg:hover{background:var(--bg2)}.b-tg:hover .ic{transform:rotate(-30deg)}}
.b-tg .i-sun,.dark .b-tg .i-moon{display:none}.dark .b-tg .i-sun{display:block}
@media (max-width:759px){.b-tg{margin-left:auto}.b-tg+.hd-menu{margin-left:0}}
.b-logo{font-weight:600;letter-spacing:-.02em;min-height:44px;display:inline-flex;align-items:center}
.b-hd-mid{display:flex;gap:16px;margin-left:clamp(24px,8vw,160px)}
.b-serif{font-family:var(--fs);font-style:italic;font-weight:400;letter-spacing:-.01em}
.b-hero{padding:calc(var(--sat) + 120px) var(--pad) 0}
.b-avail{font-size:14px;margin-bottom:24px}
.b-name{font:600 10vw/.8 var(--fd);letter-spacing:-.058em;white-space:nowrap}
.b-name .ln{padding-bottom:.08em}
.b-name [data-fit]{letter-spacing:-.058em}
.a-ft [data-fit]{letter-spacing:-.04em}
.b-intro{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;margin-top:40px;align-items:end}
.b-intro>p{font:500 clamp(24px,2.9vw,46px)/1.06 var(--fd);letter-spacing:-.035em}
.b-intro-r{display:grid;gap:20px;justify-items:start}
.b-intro-r p{max-width:400px;font-size:16px}
@media (max-width:820px){.b-intro{grid-template-columns:1fr}}
.b-btn{height:48px;padding:0 22px;border-radius:99px;background:var(--fg);color:var(--bg);display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;transition:background var(--d2),transform .45s var(--e)}
.b-btn .ic{width:18px;height:18px}
@media (hover:hover){.b-btn:hover{background:var(--acc)}}
.b-btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.b-btn{transition:background var(--d2),color var(--d2),box-shadow var(--d2),transform .45s var(--e)}
.b-btn .ic{transition:transform .45s var(--e)}
@media (hover:hover){.b-btn.ghost:hover{background:var(--fg);color:var(--bg);box-shadow:inset 0 0 0 1px var(--fg)}.b-btn:hover .ic{transform:rotate(45deg)}}
.b-reel-w{padding:clamp(48px,6vw,80px) var(--pad) 0}
.b-reel{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:clamp(8px,1.2vw,18px);overflow:hidden;cursor:pointer;color:#fff}
.b-reel::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.b-reel-lab{position:absolute;left:clamp(16px,2vw,32px);bottom:clamp(16px,2vw,28px);z-index:1;display:flex;align-items:center;gap:14px;font:500 clamp(22px,2.4vw,40px)/1 var(--fd);letter-spacing:-.03em}
.b-reel-p{width:56px;height:56px;border-radius:50%;background:#fff;color:#141414;display:grid;place-items:center;font-size:20px;transition:transform .45s var(--e)}
@media (hover:hover){.b-reel:hover .b-reel-p{transform:scale(1.12)}}
.b-reel-d{position:absolute;right:clamp(16px,2vw,32px);bottom:clamp(16px,2vw,28px);z-index:1}
.b-sec{padding:clamp(88px,11vw,170px) var(--pad) 0}
.b-sh{display:grid;grid-template-columns:1fr 2fr;gap:24px;align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.b-sh h2{font:600 clamp(40px,6.2vw,104px)/.92 var(--fd);letter-spacing:-.05em}
@media (max-width:820px){.b-sh{grid-template-columns:1fr}}
.b-ix{border-top:1px solid var(--fg)}
.b-row{display:grid;grid-template-columns:56px 1.5fr 1fr 1fr 44px;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);min-height:44px;transition:color var(--d2),padding .6s var(--e)}
.b-row h3{font:600 clamp(24px,3.3vw,54px)/1 var(--fd);letter-spacing:-.045em}
.b-row .ic{width:24px;height:24px;transition:transform .45s var(--e)}
.b-th{display:none;width:88px;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--bg2)}
.b-th img{width:100%;height:100%;object-fit:cover}
@media (hover:hover){.b-ix:hover .b-row{color:var(--mut)}.b-ix .b-row:hover{color:var(--fg);padding-left:20px}.b-row:hover>.ic{transform:rotate(45deg);color:var(--acc)}}
@media (max-width:820px){.b-row{grid-template-columns:88px 1fr;gap:4px 16px;padding:16px 0}.b-row>.mono{display:none}.b-th{display:block;grid-row:1/4}.b-row h3{font-size:24px;align-self:end}.b-row .b-tools,.b-row .ic{display:none}.b-row>.mut:not(.b-tools){align-self:start;font-size:14px}}
.b-row{row-gap:0}

 menu:()=>toggleMenu(),
 theme:()=>{setMode(isDark()?'light':'dark')},
 mail:el=>{const addr=el.getAttribute('href').replace(/^mailto:/,'');try{navigator.clipboard.writeText(addr).then(()=>toast(t('copied')+addr),()=>{})}catch(_){}location.href=el.getAttribute('href')},
 toast:el=>toast(el.dataset.v),
 top:()=>smoothTo(0),
 dir:el=>setDir(el.dataset.v),
 dev:el=>setDevice(el.dataset.v),
 empty:()=>{S.empty=!S.empty;writeHash();if(S.device==='mobile')postFrame();else render();updTB()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a])return;if(e.metaKey||e.ctrlKey)return;e.preventDefault();A[el.dataset.a](el,e)});
document.addEventListener('click',e=>{if(!e.target.closest('.b-lang'))closeLang()},true);
function closeLang(){$$('.b-lang.open').forEach(w=>{w.classList.remove('open');$('.b-lang-b',w).setAttribute('aria-expanded','false')})}
async function setLang(k){closeLang();if(!D[k]||k===LANG)return;try{localStorage.setItem('pf-lang',k)}catch(_){}
 if(!RM.matches)await app.animate([{opacity:1},{opacity:0}],{duration:160,easing:'ease-in',fill:'forwards'}).finished;
 LANG=k;applyLang();render();$('#menu').innerHTML=menuHTML();fitAll();app.getAnimations().forEach(a=>a.cancel());if(!RM.matches)app.animate([{opacity:0},{opacity:1}],{duration:320,easing:E})}
function applyLang(){root.lang=LANG;document.title=t('title');const m=document.querySelector('meta[name=description]');if(m)m.content=t('desc')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.b-lang.open')){closeLang();return}if(!lb.hidden)closeModal();else closeMenu()}if(!lb.hidden&&lbState){if(e.key==='ArrowRight')lbStep(1);if(e.key==='ArrowLeft')lbStep(-1)}});

/* ---------- toolbar, device preview ---------- */
const phf=null,stage=null,ph=null;
function updTB(){return;$$('[data-seg="dir"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.dir));$$('[data-seg="dev"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.device));const t=$('.pt-tg');t.classList.toggle('on',S.empty);t.setAttribute('aria-pressed',S.empty);$('#hint').textContent=S.device==='mobile'?'402 × 874':`${innerWidth} × ${innerHeight-44}`}
function postFrame(){try{phf.contentWindow.postMessage({t:'state',dir:S.dir,empty:S.empty},'*')}catch(_){}}
async function setDir(d){if(d===S.dir)return;S.dir=d;writeHash();updTB();if(S.device==='mobile'){postFrame();return}
 if(!RM.matches)await app.animate([{opacity:1},{opacity:0}],{duration:150,easing:'ease-in',fill:'forwards'}).finished;
 S.hold=true;render(true);jumpTo(0);app.getAnimations().forEach(a=>a.cancel());app.animate([{opacity:0},{opacity:1}],{duration:450,easing:E});S.hold=false;observeReveals()}
function fitPhone(){const s=Math.min(1,(innerHeight-44-48)/874,(innerWidth-48)/402);ph.style.transform=`scale(${s})`}
function setDevice(d){if(d===S.device)return;S.device=d;cur.classList.toggle('hide',d==='mobile');
 if(d==='mobile'){stopPrev();$$('video',app).forEach(v=>v.pause());app.style.display='none';stage.hidden=false;fitPhone();phf.src=location.href.split('#')[0]+hashStr();SM.on=false}
 else{try{const h=phf.contentWindow.location.hash;if(h){history.replaceState(null,'',h);readHash()}}catch(_){}stage.hidden=true;phf.src='about:blank';app.style.display='';SM.on=smoothOK();render(true);jumpTo(0)}
 updTB()}
addEventListener('message',e=>{if(!FRAME||!e.data||e.data.t!=='state')return;const ch=S.dir!==e.data.dir;S.dir=e.data.dir;S.empty=e.data.empty;writeHash();render(ch);if(ch)jumpTo(0)});

/* ---------- smooth scroll + scroll fx ---------- */
const smoothOK=()=>FINE.matches&&!RM.matches&&!FRAME;
const SM={on:smoothOK(),cur:scrollY,tgt:scrollY,active:false};
const maxY=()=>document.documentElement.scrollHeight-innerHeight;
addEventListener('wheel',e=>{if(!SM.on||e.ctrlKey||root.classList.contains('lock'))return;if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;e.preventDefault();if(!SM.active){SM.cur=scrollY;SM.tgt=scrollY;SM.active=true}SM.tgt=clamp(SM.tgt+e.deltaY*(e.deltaMode===1?36:e.deltaMode===2?innerHeight:1),0,maxY())},{passive:false});
addEventListener('scroll',()=>{if(!SM.active){SM.cur=SM.tgt=scrollY}},{passive:true});
let lastY=scrollY,vel=0,mqRate=1,hdSolid=false;
function fx(){
 const vh=innerHeight,W2=[];
 for(const el of FX.par){const r=el.parentNode.getBoundingClientRect();if(r.bottom<-50||r.top>vh+50)continue;const v=(r.top+r.height/2-vh/2)*-(+el.dataset.par);W2.push(()=>{el.style.transform=`translate3d(0,${v.toFixed(1)}px,0)`})}
 if(FX.skew.length){const sk=clamp(vel*-.05,-2.5,2.5);W2.push(()=>FX.skew.forEach(el=>{el.style.transform=Math.abs(sk)<.02?'':`skewY(${sk.toFixed(2)}deg)`}))}
 for(const h of FX.hl){const r=h.el.getBoundingClientRect();if(r.bottom<0||r.top>vh)continue;const p=clamp((vh*.82-r.top)/(r.height+vh*.25));const n=Math.round(p*h.w.length);if(n!==h.n){h.n=n;W2.push(()=>h.w.forEach((w,i)=>w.classList.toggle('lit',i<n)))}}
 for(const s of FX.split){const r=s.el.getBoundingClientRect();if(r.bottom<0)continue;const p=clamp(-r.top/(r.height-vh));W2.push(()=>{s.l.style.transform=`translate3d(${(-p*40).toFixed(2)}vw,0,0)`;s.r.style.transform=`translate3d(${(p*40).toFixed(2)}vw,0,0)`;s.p.style.transform=`scale(${(1+p*1.4).toFixed(3)}) rotate(${(p*45).toFixed(1)}deg)`;s.p.style.opacity=(1-p*.9).toFixed(3)})}
 for(const g of FX.grow){const r=g.el.getBoundingClientRect();if(r.bottom<0||r.top>vh)continue;const p=clamp(-r.top/(r.height-vh)/.8),e=1-Math.pow(1-p,3);W2.push(()=>{g.v.style.transform=`scale(${(.38+.62*e).toFixed(4)})`;g.b.style.opacity=clamp((p-.55)/.3).toFixed(3)})}
 for(const st of FX.stack){for(let i=0;i<st.length-1;i++){const a=st[i],nr=st[i+1].c.getBoundingClientRect(),ar=a.c.getBoundingClientRect();const p=clamp((ar.bottom-nr.top)/ar.height);W2.push(()=>{a.i.style.transform=`scale(${(1-p*.08).toFixed(4)})`;a.d.style.opacity=(p*.6).toFixed(3)})}}
 if(innerWidth>=820)for(const h of FX.hpin){const r=h.el.getBoundingClientRect();const dist=h.t.scrollWidth-innerWidth;const p=clamp(-r.top/Math.max(1,r.height-vh));const idx=Math.min(h.n,1+Math.floor(p*h.n*.999));W2.push(()=>{h.t.style.transform=`translate3d(${(-p*dist).toFixed(1)}px,0,0)`;h.bar.style.transform=`scaleX(${p.toFixed(4)})`;if(idx!==h.last){h.last=idx;h.c.textContent=`${pad(idx)} / ${pad(h.n)}`}})}
 if(FX.mq.length){const tgt=(vel<-.5?-1:1)*(1+Math.min(5,Math.abs(vel)*.12));mqRate+=(tgt-mqRate)*.08;FX.mq.forEach(a=>{a.playbackRate=mqRate})}
 if(S.dir==='b'){const want=hdSolid?scrollY>20:scrollY>60;if(want!==hdSolid){hdSolid=want;W2.push(()=>$$('.hd').forEach(h=>h.classList.toggle('solid',want)))}}
 W2.forEach(f=>f());
}
/* cursor + floating preview */
const cur=$('#cur'),curL=$('span',cur),fp=$('#fp'),fpv=$('video',fp),fpi=$('img',fp);
let mx=-200,my=-200,cx=-200,cy=-200,fx_=-200,fy_=-200,fs=.6,fpOn=false,curLab=null,magEl=null,hoverEl=null;
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;mx=e.clientX;my=e.clientY;if(S.device!=='mobile')cur.classList.remove('hide');
 const t=e.target.closest&&e.target.closest('[data-cursor]');const lab=t?t.dataset.cursor:'';if(lab!==curLab){curLab=lab;cur.classList.toggle('big',!!lab);curL.textContent=lab}
 const m=e.target.closest&&e.target.closest('[data-mag]');if(magEl&&magEl!==m){magEl.style.transform='';magEl=null}if(m&&!RM.matches){magEl=m;const r=m.getBoundingClientRect();m.style.transform=`translate3d(${((mx-r.left-r.width/2)*.3).toFixed(1)}px,${((my-r.top-r.height/2)*.3).toFixed(1)}px,0)`}},{passive:true});
document.addEventListener('mouseleave',()=>cur.classList.add('hide'));
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const c=e.target.closest('[data-hp],[data-fp]');if(!c||c===hoverEl)return;hoverEl=c;
 if(c.dataset.fp){fp.style.aspectRatio=c.dataset.fpar;fp.style.width=c.dataset.fpar==='4/5'?'min(18vw,260px)':'';fpi.src=`assets/c${c.dataset.fp}.webp`;fpv.classList.remove('on');loadSrc(fpv,'p'+c.dataset.fp);fpv.play().catch(()=>{});fpOn=true;fp.classList.add('on');if(fx_<-100){fx_=mx;fy_=my}}
 else{const v=$('video[data-p]',c);if(v)playPrev(v)}});
document.addEventListener('pointerout',e=>{const c=e.target.closest('[data-hp],[data-fp]');if(!c||c.contains(e.relatedTarget))return;if(c===hoverEl)hoverEl=null;if(c.dataset.fp){fpOn=false;fp.classList.remove('on');fpv.pause()}else{const v=$('video[data-p]',c);if(v&&v===prevV)stopPrev(v)}});
function tick(){
 if(SM.active){SM.cur+=(SM.tgt-SM.cur)*.1;if(Math.abs(SM.tgt-SM.cur)<.5){SM.cur=SM.tgt;SM.active=false}window.scrollTo(0,SM.cur)}
 const y=scrollY,dv=y-lastY;lastY=y;vel+=(dv-vel)*.2;
 fx();
 if(FINE.matches&&!FRAME){cx+=(mx-cx)*.22;cy+=(my-cy)*.22;cur.style.transform=`translate3d(${cx.toFixed(1)}px,${cy.toFixed(1)}px,0)`;
  if(fpOn||fs>.61){const dx=mx-fx_;fx_+=dx*.14;fy_+=(my-fy_)*.14;fs+=((fpOn?1:.6)-fs)*.15;const w=fp.offsetWidth,h=fp.offsetHeight;fp.style.transform=`translate3d(${(fx_-w/2).toFixed(1)}px,${(fy_-h/2).toFixed(1)}px,0) rotate(${clamp(dx*.06,-8,8).toFixed(2)}deg) scale(${fs.toFixed(3)})`}}
 requestAnimationFrame(tick)}
fpv.addEventListener('playing',()=>fpv.classList.add('on'));

/* hover-expanding rows (desktop) */
let rxT=null,rxOpen=null;
function rxSet(r){if(rxOpen===r)return;if(rxOpen&&rxOpen.isConnected){rxOpen.classList.remove('xo');const v=$('video[data-p]',rxOpen);if(v)stopPrev(v)}rxOpen=r;if(r){r.classList.add('xo');const v=$('video[data-p]',r);if(v)playPrev(v)}}
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse'||!FINE.matches||innerWidth<821)return;const r=e.target.closest('.b-row');if(!r)return;clearTimeout(rxT);if(r!==rxOpen)rxT=setTimeout(()=>rxSet(r),rxOpen?200:110)});
document.addEventListener('pointerout',e=>{const ix=e.target.closest('.b-ix');if(!ix||ix.contains(e.relatedTarget))return;clearTimeout(rxT);rxT=setTimeout(()=>rxSet(null),280)});

/* theme: follows the system until the visitor picks one */
const DQ=matchMedia('(prefers-color-scheme: dark)');
let mode=null;try{mode=localStorage.getItem('pf-theme')}catch(_){}
function isDark(){if(mode)return mode==='dark';const t=root.getAttribute('data-theme');if(t)return t==='dark';return DQ.matches}
function applyMode(){if(mode)root.setAttribute('data-mode',mode);else root.removeAttribute('data-mode');const d=isDark();root.classList.toggle('dark',d);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#121211':'#ECEAE4';$$('.b-tg').forEach(b=>b.setAttribute('aria-label',d?t('theme.light'):t('theme.dark')))}
function setMode(m){mode=m;try{localStorage.setItem('pf-theme',m)}catch(_){}applyMode()}
DQ.addEventListener('change',applyMode);
new MutationObserver(applyMode).observe(root,{attributes:true,attributeFilter:['data-theme']});

/* ---------- clock, resize ---------- */
const clk=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Warsaw',hour:'2-digit',minute:'2-digit'});
function tickClock(){const t=clk.format(new Date());$$('[data-clock]').forEach(el=>{if(el.textContent!==t)el.textContent=t})}
setInterval(tickClock,15000);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const wide=innerWidth>=820;if(wide!==S.wide){S.wide=wide;render()}fitAll();layout();if(S.device==='mobile')fitPhone();updTB()},120)},{passive:true});

/* ---------- boot ---------- */
window.__pfReady=1;applyLang();readHash();writeHash();render(true);applyMode();requestAnimationFrame(tick);
if(document.fonts)document.fonts.addEventListener('loadingdone',()=>{fitAll();layout()});
})();
</script>
</body>
</html>
